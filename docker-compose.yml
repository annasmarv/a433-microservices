version: '3.8'

services:
  item-app:
    image: ghcr.io/annasmarv/item-app:v1
    container_name: item-app
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - item-db

  item-db:
    image: mongo:3
    container_name: item-db
    restart: always
    volumes:
      - app-db:/data/db

volumes:
  app-db:
